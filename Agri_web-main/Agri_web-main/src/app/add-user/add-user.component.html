    
<div class="main-content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-12">
          <!-- Bouton de retour -->
          <div class="header mb-3">
            <button routerLink="/users" routerLinkActive="active" class="btn btn-outline-success btn-rounded">
              <i class="material-icons">arrow_back</i>
            </button>
          </div>
  
          <!-- Carte principale -->
          <div class="card">
            <div class="card-header card-header-danger">
              <h4 class="card-title">Ajout d'employée</h4>
            </div>
            <div class="card-body">
              <form #employeeForm="ngForm" id="form" (ngSubmit)="save(employeeForm.value)">
                <div class="row">
                  <!-- Colonne gauche -->
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="firstName">Prénom</label>
                      <input ngModel type="text" name="firstName" placeholder="Entrez votre prénom" class="form-control">
                    </div>
                    
                    <div class="form-group">
                      <label for="exampleInputEmail1">Adresse email</label>
                      <input ngModel type="email" name="email" placeholder="Entrez email" class="form-control">
                    </div>
                    
                    <div class="form-group">
                      <label for="Address">Adresse</label>
                      <input ngModel name="address" placeholder="Entrez votre adresse" class="form-control">
                    </div>
                  </div>
                  
                  <!-- Colonne droite -->
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="lastName">Nom</label>
                      <input ngModel type="text" name="lastName" placeholder="Entrez votre nom" class="form-control">
                    </div>
                    
                    <div class="form-group">
                      <label for="mobile">Téléphone</label>
                      <input ngModel name="mobile" placeholder="Entrez le numéro de téléphone" class="form-control">
                    </div>
                    
                    <div class="form-group">
                      <label for="picker1">Choisir un rôle</label>
                      <select name="role" ngModel class="form-control">
                        <option value="Admin">Admin</option>
                        <option value="Agriculteur">Agriculteur</option>
                      </select>
                    </div>
                  </div>
                  
                  <!-- Bouton de soumission -->
                  <div class="col-md-12 text-right mt-3">
                    <button type="submit" class="btn btn-success btn-rounded">
                      Soumettre
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Modals restent inchangés -->
    

    <!-- Modal 1-->
    <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content p-3" style="border-radius: 10px;">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-success">Succès</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body text-center">
                    <p style="color: #4caf50; font-size: 14px; font-weight: 500; line-height: 1.5;">
                        ✅ Le nouvel employé a été ajouté avec succès !
                    </p>
                </div>
                <div class="modal-footer border-0 justify-content-center">
                    <button type="button" class="btn btn-success btn-sm" data-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>
    


    <!-- Modal 2-->
    <div class="modal fade" id="exampleModal2" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content p-3" style="border-radius: 10px;">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-danger">Erreur</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body text-center">
                    <p style="color: #d22346; font-size: 14px; font-weight: 500; line-height: 1.5;">
                        L'adresse e-mail est déjà prise.<br>Veuillez réessayer avec une adresse e-mail différente.
                    </p>
                </div>
                <div class="modal-footer border-0 justify-content-center">
                    <button type="button" class="btn btn-danger btn-sm" data-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>
