<div class="main-content">
    <div class="container-fluid">
        <div class="col-dm-8">
            <div class="header mb-3">
                <button routerLink="/sensors/addSensor" routerLinkActive="active" class="btn btn-outline-danger" *ngIf="role === 'Admin'">
                    <i class="material-icons">sensors</i> <!-- Icône de capteur -->
                    <span class="plus-icon">+</span> <!-- Symbole "+" -->
                </button>
            </div>
            <div class="card mb-4">
                <div class="card-header card-header-danger">
                    <h4 class="card-title">Gestion des capteurs</h4>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover">
                            <thead class="text-primary">
                                <tr>
                                    <th>Identificateur</th>
                                    <th>Capteur</th>
                                    <th>Appareil</th>
                                    <th>Indice</th>
                                    <th>Options</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let sensor of listSensor">
                                    <td>{{ sensor.idU }}</td>
                                    <td>
                                        {{ getSensorType(sensor.typeSensor)}}
                                      </td>
                                      
                                      <td>
                                        {{ sensor.endDevice?.codDevice || 'Aucun appareil' }}

                                      </td>
                                      
                                    <td>
                                        {{ sensor.index}}
                                    </td>
                                    
                                    <td>
                                        <span class="icon warning-icon" [routerLink]="['/sensors/modifSensor', sensor.id]" 
                                        routerLinkActive="active">
                                            <i class="material-icons">settings</i>
                                        </span>
                                        <span class="icon view-icon"  [routerLink]="['/sensors/viewSensor', sensor.id]" 
                                        routerLinkActive="active">
                                            <i class="material-icons">visibility</i>
                                        </span>
                                        <span class="icon delete-icon" (click)="SelectSensor(sensor)"*ngIf="role === 'Admin'">
                                            <i class="material-icons">delete</i>
                                        </span>
                                        <span class="icon command-icon" (click)="sendCommand(sensor)">
                                            <i class="material-icons">arrow_circle_right</i>
                                        </span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>


<!-- Modal 2-->
<div class="modal fade" id="exampleModalDelete" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content p-3" style="border-radius: 10px;">
            <div class="modal-header border-0">
                <h5 class="modal-title text-danger">Suppression</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body text-center">
                <p style="color: #d22346; font-size: 14px; font-weight: 500; line-height: 1.5;">
                    Voulez vous vraiment supprimer ce capteur? 
                </p>
            </div>
            <div class="modal-footer border-0 justify-content-center">
                <button type="button" class="btn btn-danger btn-sm" (click)="deleteSensor(sensor.id)"  data-dismiss="modal">Supprimer</button>
            </div>
        </div>
    </div>
</div>
