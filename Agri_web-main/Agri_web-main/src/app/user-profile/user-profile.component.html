<div class="main-content">
  <div class="container-fluid">
      <div class="row">
          <div class="col-md-12">
              <div class="card">
                  <div class="card-header card-header-danger">
                      <h4 class="card-title">Gestion du profil</h4>
                  </div>
                  <div class="card-body">
                    <form (ngSubmit)="onSubmit()">
                      <!-- Nom & Prénom sur la même ligne -->
                      <div class="form-row">
                        <div class="form-group col-md-6">
                          <label for="name">Prénom</label>
                          <input type="text" id="name" class="form-control" [(ngModel)]="user.firstName" name="firstName" required>
                        </div>
                        <div class="form-group col-md-6">
                          <label for="prenom">Nom</label>
                          <input type="text" id="prenom" class="form-control" [(ngModel)]="user.lastName" name="lastName" required>
                        </div>
                      </div>
                
                      <!-- Email -->
                      <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control" [(ngModel)]="user.email" name="email" required>
                      </div>
                
                      <!-- Mot de passe -->
                      <!-- Adresse & Téléphone sur la même ligne -->
                      <div class="form-row">
                        <div class="form-group col-md-6">
                          <label for="adresse">Adresse</label>
                          <input type="text" id="adresse" class="form-control" [(ngModel)]="user.address" name="address" required>
                        </div>
                        <div class="form-group col-md-6">
                          <label for="telephone">Numéro de Téléphone</label>
                          <input type="tel" id="telephone" class="form-control" [(ngModel)]="user.mobile" name="mobile" required>
                        </div>
                      </div>

                      <div class="form-group">
                        <label for="picker1">Choisir un rôle</label>
                        <select name="role" [(ngModel)]="user.role" class="form-control" [disabled]="true">
                          <option value="Admin">Admin</option>
                          <option value="Agriculteur">Agriculteur</option>
                        </select>
                      </div>
                
                      <!-- Bouton -->
                      <div class="text-center">
                        <button type="submit" class="btn btn-success">Envoyer</button>
                      </div>
                    </form>
                  </div>
              </div>
          </div>
      </div>
  </div>
</div>
